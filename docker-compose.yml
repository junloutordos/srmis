version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bugsaymis_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - mysql
      - redis
    networks:
      - bugsaymis_network

  mysql:
    image: mysql:8.0
    container_name: bugsaymis_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bugsaymis
      MYSQL_ROOT_PASSWORD: F9oPkWUZJEf7v1NtbKE0XNrtxF6cTbf
    ports:
      - "3306:3306"   # LAN only — accessible to staging (10.10.11.35), NOT internet
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bugsaymis_network

  redis:
    image: redis:7-alpine
    container_name: bugsaymis_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - bugsaymis_network

  nginx:
    image: nginx:latest
    container_name: bugsaymis_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - bugsaymis_network

  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    container_name: bugsaymis_soketi
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: bugsaymis
      SOKETI_DEFAULT_APP_KEY: JmzeD9601xoTtPhx58qxlX6sg4jJmX
      SOKETI_DEFAULT_APP_SECRET: hCwOFUeVzEMndsDoYcvYQ6vy479SaEns
      SOKETI_DEBUG: 0
      SOKETI_PORT: 9601
    ports:
      - "9601:9601"
    networks:
      - bugsaymis_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: bugsaymis_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - bugsaymis_network

networks:
  bugsaymis_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
