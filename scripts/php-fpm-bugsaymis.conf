;---------------------------------------------------------------------------
; PHP-FPM pool configuration for BUGSAYMIS
;
; Place in: /etc/php/8.3/fpm/pool.d/bugsaymis.conf
; Reload:   systemctl reload php8.3-fpm
;
; Tuned for ~50–150 concurrent users on a 4-core / 8 GB RAM server.
; Adjust pm.max_children based on: RAM ÷ ~40MB per process.
;---------------------------------------------------------------------------

[bugsaymis]
user  = www-data
group = www-data

listen = /var/run/php/php8.3-fpm-bugsaymis.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Dynamic process manager — spawns workers on demand, reclaims idle ones
pm                   = dynamic
pm.max_children      = 30       ; max concurrent PHP processes
pm.start_servers     = 6        ; on pool start
pm.min_spare_servers = 4        ; keep at least 4 idle
pm.max_spare_servers = 10       ; reclaim if more than 10 idle
pm.max_requests      = 500      ; recycle worker after 500 requests (prevents memory leaks)
pm.process_idle_timeout = 30s

; Timeouts
request_terminate_timeout = 120
request_slowlog_timeout   = 5s
slowlog = /var/log/php/bugsaymis-slow.log

; OPcache — dramatically reduces PHP startup time
php_admin_value[opcache.enable]                   = 1
php_admin_value[opcache.memory_consumption]       = 256
php_admin_value[opcache.interned_strings_buffer]  = 16
php_admin_value[opcache.max_accelerated_files]    = 20000
php_admin_value[opcache.validate_timestamps]      = 0   ; set to 1 during development
php_admin_value[opcache.revalidate_freq]          = 0
php_admin_value[opcache.fast_shutdown]            = 1

; Upload limits (profile pictures, documents, signatures)
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size]       = 22M
php_admin_value[memory_limit]        = 256M
php_admin_value[max_execution_time]  = 120

; Error logging
php_admin_flag[log_errors]    = on
php_admin_value[error_log]    = /var/log/php/bugsaymis-error.log
php_admin_flag[display_errors] = off
