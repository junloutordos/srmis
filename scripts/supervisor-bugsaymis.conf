;---------------------------------------------------------------------------
; Supervisor configuration for BUGSAYMIS queue workers
;
; Copy to: /etc/supervisor/conf.d/bugsaymis.conf
; Then: supervisorctl reread && supervisorctl update && supervisorctl start bugsaymis:*
;---------------------------------------------------------------------------

[program:bugsaymis-worker]
process_name=%(program_name)s_%(process_num)02d
; Adjust the path to your actual Laravel installation directory
command=php /var/www/bugsaymis/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=60
directory=/var/www/bugsaymis
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
; Run 3 parallel workers to handle concurrent email/job bursts
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/bugsaymis-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
