#---------------------------------------------------------------------------
# Nginx configuration for BUGSAYMIS (Laravel + Inertia/Vue)
#
# Place in: /etc/nginx/sites-available/bugsaymis
# Enable:   ln -s /etc/nginx/sites-available/bugsaymis /etc/nginx/sites-enabled/bugsaymis
# Reload:   nginx -t && systemctl reload nginx
#---------------------------------------------------------------------------

server {
    listen 80;
    server_name bugsaymis.crc.pshs.edu.ph;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bugsaymis.crc.pshs.edu.ph;

    root /var/www/bugsaymis/public;
    index index.php;

    # SSL — managed by Certbot or place your own certs here
    ssl_certificate     /etc/letsencrypt/live/bugsaymis.crc.pshs.edu.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bugsaymis.crc.pshs.edu.ph/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # File upload limit (profile pictures, signatures, attachments)
    client_max_body_size 20M;

    # Gzip compression for JS/CSS/HTML/JSON
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/x-font-ttf
        application/xml
        font/opentype
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Long cache for Vite-hashed assets (JS/CSS bundles)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # All requests through Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Tune timeouts for long-running requests (file imports, reports)
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;

        # Buffer tuning
        fastcgi_buffers          16 32k;
        fastcgi_buffer_size      64k;
    }

    # Block direct access to .env and hidden files
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/bugsaymis-access.log;
    error_log  /var/log/nginx/bugsaymis-error.log;
}
