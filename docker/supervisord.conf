[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
loglevel=warn
user=root

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5

[program:php-fpm]
command=php-fpm
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:cron]
command=cron -f
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
priority=20

[program:queue-worker]
; --timeout must be < the connection's retry_after (900s in config/queue.php)
; and >= the longest individual job timeout (ProcessIssuanceRelease = 600s).
; --tries=1 — per-job $tries is the source of truth; we surface failures
; rather than silently retry side-effectful work (PDF + 300+ emails).
command=php /var/www/artisan queue:work redis --sleep=3 --tries=1 --timeout=700 --max-jobs=500 --max-time=3600
directory=/var/www
user=www-data
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/log/queue-worker.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/queue-worker-error.log
stderr_logfile_maxbytes=5MB
priority=30
