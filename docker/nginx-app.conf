## ── Rate-limiting zones ───────────────────────────────────────────────────────
# Defined at http context — included via sites-enabled so we declare them here;
# nginx silently ignores duplicate zone declarations if sizes match.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 20M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=(self), payment=()" always;

    # ── Health check for ALB / ECS ────────────────────────────────────────────
    location = /_status {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Soketi — WebSocket + HTTP polling (Pusher protocol) ──────────────────
    location ~ ^/(app|apps|pusher)/ {
        proxy_pass         http://127.0.0.1:9601;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Rate-limited login endpoint ────────────────────────────────────────────
    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        # Prevent Cloudflare from caching PHP/HTML responses — ensures browsers
        # always get the latest Vite asset hashes after a deploy.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma        "no-cache" always;

        fastcgi_pass          127.0.0.1:9000;
        fastcgi_index         index.php;
        fastcgi_param         SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include               fastcgi_params;
        fastcgi_param         HTTPS on;
        fastcgi_read_timeout  120;
        fastcgi_send_timeout  120;
        fastcgi_buffers       16 16k;
        fastcgi_buffer_size   32k;
    }

    # ── Service Workers — must never be cached so updates are picked up promptly
    location ~* ^/(sw|srmis-sw)\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ── App storage proxy — all /media/* requests go through PHP (auth + S3) ──
    # Must be declared before the static-asset rule so image extensions don't
    # get intercepted by try_files and return 404.
    location ^~ /media/ {
        try_files $uri /index.php?$query_string;
    }

    # ── Static assets (public/build, favicons, etc.) ───────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Block sensitive files ──────────────────────────────────────────────────
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }
}
